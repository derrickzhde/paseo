name: Release Mobile

on:
  push:
    tags:
      - "v*"
      - "!v*-rc.*"
      - "!v*-beta.*"
  workflow_dispatch: {}

jobs:
  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit Android
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  upload_android_screenshots:
    name: Upload Google Play screenshots
    needs: [build_android, submit_android]
    environment: production
    runs_on: macos-medium
    steps:
      - uses: eas/checkout
      - name: Install fastlane
        run: bundle install
      - name: Upload screenshots
        run: |
          export ANDROID_VERSION_CODE="${{ needs.build_android.outputs.app_build_version }}"
          bundle exec fastlane android upload_screenshots
